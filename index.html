<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>tienditas.uy — Muy pronto abrimos</title>
  <style>
    :root {
      --bg-page: #eef4f9;
      --card-bg: #ffffff;
      --blue-primary: #0b63a5;
      --gold-accent: #e0a81b;
      --text-main: #4a5568;
      --badge-bg: #fef4c8;
      --badge-text: #5c4912;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-page);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      background-color: var(--card-bg);
      width: 100%;
      max-width: 440px;
      border-radius: 24px;
      padding: 36px 28px 28px;
      box-shadow: 0 14px 35px rgba(11, 99, 165, 0.08);
      text-align: center;
    }

    .logo-box {
      width: 210px;
      height: 230px;
      margin: 0 auto 14px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-box img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      display: block;
    }

    h1 {
      font-size: 2.3rem;
      font-weight: 800;
      color: var(--blue-primary);
      letter-spacing: -0.5px;
      margin-bottom: 6px;
    }

    h1 span.uy {
      color: var(--gold-accent);
    }

    .tagline {
      font-size: 1.02rem;
      font-weight: 700;
      color: var(--blue-primary);
      margin-bottom: 22px;
    }

    .badge {
      display: inline-block;
      background-color: var(--badge-bg);
      color: var(--badge-text);
      font-size: 0.85rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      padding: 10px 22px;
      border-radius: 999px;
      margin-bottom: 24px;
    }

    .copy {
      font-size: 0.98rem;
      line-height: 1.5;
      color: var(--text-main);
      margin-bottom: 18px;
    }

    .socials {
      margin-top: 22px;
      margin-bottom: 18px;
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--blue-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .socials a {
      color: var(--blue-primary);
      text-decoration: none;
    }

    .socials a:hover {
      text-decoration: underline;
    }

    footer {
      font-size: 0.82rem;
      color: #8a94a6;
    }

    footer .heart {
      color: #e64965;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="logo-box">
      <!-- Reemplaza "escudo-tienditas.jpg" por la ruta o URL real de tu imagen del escudo -->
      <img src="1795219302031.jpg" alt="Escudo de tienditas.uy" />
    </div>

    <h1>tienditas<span class="uy">.uy</span></h1>
    <p class="tagline">Las tienditas de Uruguay, te dan más</p>

    <div class="badge">✨ MUY PRONTO ABRIMOS ✨</div>

    <p class="copy">
     Nuestra Misión, visibilizar y hacer crecer a los pequeños emprendimientos.
    </p>

    <p class="copy">
      Si tenés una tiendita y querés ser de las primeras, escribinos.
    </p>

    <nav class="socials" aria-label="Redes sociales">
      <a href="https://instagram.com/tienditas.uy" target="_blank" rel="noopener noreferrer">Instagram</a>
      <span>•</span>
      <a href="#" target="_blank" rel="noopener noreferrer">Facebook</a>
      <span>•</span>
      <a href="https://tiktok.com/@tienditas.uy" target="_blank" rel="noopener noreferrer">TikTok</a>
    </nav>

    <footer>
      © 2026 tienditas.uy - Hecho con <span class="heart">♥</span> en Uruguay
    </footer>
  </main>
</body>
</html>
